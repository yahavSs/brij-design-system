<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
  <div style="background:var(--sage);padding:20px;border-radius:4px;text-align:center;"><div style="height:36px;background:var(--ink);border-radius:4px;"></div><div class="mono" style="margin-top:10px;">4px</div><div class="label" style="font-size:10px;">Swatches, code</div></div>
  <div style="background:var(--sage);padding:20px;border-radius:28px;text-align:center;"><div style="height:36px;background:var(--ink);border-radius:28px;"></div><div class="mono" style="margin-top:10px;">28px</div><div class="label" style="font-size:10px;">Panels, cards</div></div>
  <div style="background:var(--sage);padding:20px;border-radius:52px;text-align:center;"><div style="height:36px;background:var(--ink);border-radius:52px;"></div><div class="mono" style="margin-top:10px;">52px</div><div class="label" style="font-size:10px;">Pills, buttons</div></div>
</div>
<div class="label" style="margin-top:12px;padding:0 4px;">Only three radii — no in-between values.</div>
</body></html>
