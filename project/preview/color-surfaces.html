<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
<div style="background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;"><div style="height:46px;background:#fff;border:1px solid var(--border);border-radius:8px;"></div><div style="margin-top:10px;font-weight:600;font-size:12px;">White</div><div class="mono">#FFFFFF</div></div>
<div style="background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;"><div style="height:46px;background:#faf9f4;border-radius:8px;"></div><div style="margin-top:10px;font-weight:600;font-size:12px;">Cream</div><div class="mono">#FAF9F4</div></div>
<div style="background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;"><div style="height:46px;background:#ebede7;border-radius:8px;"></div><div style="margin-top:10px;font-weight:600;font-size:12px;">Sage</div><div class="mono">#EBEDE7</div></div>
<div style="background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;"><div style="height:46px;background:#181b18;border-radius:8px;"></div><div style="margin-top:10px;font-weight:600;font-size:12px;">Ink</div><div class="mono">#181B18</div></div>
</div>
<div style="margin-top:12px;padding:12px 4px;" class="label">Surfaces — white dominates, cream warms, sage panels, ink for contrast.</div>
</body></html>
