<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
  <div style="background:var(--cream);border:1px solid var(--border);border-radius:14px;padding:24px;">
    <div class="label" style="margin-bottom:10px;">Hover</div>
    <button style="display:inline-flex;align-items:center;gap:12px;padding:10px 16px;border-radius:52px;font-family:var(--serif);font-size:16px;color:var(--ink);border:1px solid var(--border);background:transparent;opacity:0.85;cursor:pointer;">Button <img src="../assets/arrow-dark.svg" style="width:17px;height:16px;" alt=""></button>
    <div class="mono" style="margin-top:10px;">opacity: .85</div>
  </div>
  <div style="background:var(--cream);border:1px solid var(--border);border-radius:14px;padding:24px;">
    <div class="label" style="margin-bottom:10px;">Press</div>
    <button style="display:inline-flex;align-items:center;gap:12px;padding:10px 16px;border-radius:52px;font-family:var(--serif);font-size:16px;color:var(--ink);border:1px solid var(--border);background:transparent;transform:scale(.98);cursor:pointer;">Button <img src="../assets/arrow-dark.svg" style="width:17px;height:16px;" alt=""></button>
    <div class="mono" style="margin-top:10px;">transform: scale(.98)</div>
  </div>
</div>
<div class="label" style="margin-top:12px;padding:0 4px;">No darken. No lift. No glow. No shadow.</div>
</body></html>
