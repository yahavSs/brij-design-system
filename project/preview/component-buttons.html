<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--sage);border-radius:24px;padding:28px;">
  <button style="display:inline-flex;align-items:center;gap:14px;padding:10px 18px;border-radius:52px;font-family:var(--serif);font-size:18px;color:var(--ink);border:1px solid var(--border);background:transparent;cursor:pointer;">Button <img src="../assets/arrow-dark.svg" style="width:19px;height:18px;" alt=""></button>
  <button style="display:inline-flex;align-items:center;gap:14px;padding:10px 18px;border-radius:52px;font-family:var(--serif);font-size:18px;color:var(--ink);border:none;background:var(--grad-rev);cursor:pointer;">Button <img src="../assets/arrow-white.svg" style="width:19px;height:18px;" alt=""></button>
  <button style="display:inline-flex;align-items:center;gap:14px;padding:10px 18px;border-radius:52px;font-family:var(--serif);font-size:18px;color:var(--ink);border:none;background:#fff;cursor:pointer;">Button <img src="../assets/arrow-dark.svg" style="width:19px;height:18px;" alt=""></button>
  <button style="padding:8px 16px;border-radius:52px;font-family:var(--serif);font-size:16px;color:var(--ink);border:1px solid var(--border);background:transparent;cursor:pointer;">Color Palette</button>
</div>
<div class="label" style="margin-top:12px;padding:0 4px;">Outline · Gradient (primary CTA, max 1/viewport) · Solid · Pill (no arrow)</div>
</body></html>
