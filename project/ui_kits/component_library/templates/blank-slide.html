<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Brij - Blank Slide</title>
  <link rel="stylesheet" href="../../../colors_and_type.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    .slide {
      width: 1920px; height: 1080px;
      flex: none;
      background: var(--brij-cream);
      color: var(--fg-1);
      font-family: var(--brij-sans);
      position: relative;
      transform-origin: center;
      padding: 96px 128px;
    }
    .wordmark { position: absolute; top: 64px; left: 128px; height: 40px; }
    .label {
      font-size: 22px; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--fg-3); margin-bottom: 36px;
    }
    .headline {
      font-family: var(--brij-serif);
      font-size: 96px; line-height: 1.08;
      color: var(--fg-1);
      max-width: 1400px;
    }
    .body {
      font-size: 32px; line-height: 1.5;
      color: var(--fg-2); letter-spacing: 0.02em;
      max-width: 1100px; margin-top: 40px;
    }
    .footer {
      position: absolute; bottom: 48px; left: 128px; right: 128px;
      display: flex; justify-content: space-between;
      font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--fg-3);
      border-top: 1px solid var(--border); padding-top: 24px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="slide" id="slide">
      <img src="../../../assets/brij-wordmark.svg" class="wordmark" alt="Brij" />
      <div style="position:absolute; top:360px; left:128px; right:128px;">
        <div class="label">[ Section · Replace me ]</div>
        <h1 class="headline">Replace this with the slide headline.</h1>
        <p class="body">Optional subcopy. Keep it short - one or two sentences at most.</p>
      </div>
      <div class="footer">
        <span>Intelligence Lab.</span>
        <span>Tel Aviv</span>
      </div>
    </div>
  </div>
  <script>
    // Scale 1920×1080 to fit viewport
    function fit() {
      const s = document.getElementById('slide');
      const k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      s.style.transform = `scale(${k})`;
    }
    fit();
    window.addEventListener('resize', fit);
  </script>
</body>
</html>
